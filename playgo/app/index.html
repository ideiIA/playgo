<!doctype html>
<html lang="pt-BR" class="abrindo">
<head>
  <meta charset="utf-8">
  <style>html.abrindo{background:#ff3d81}#abertura{position:fixed;inset:0;z-index:100;background:#ff3d81;display:grid;place-items:center;transition:opacity .3s ease}#abertura.sai{opacity:0;pointer-events:none}#abertura img{width:190px;height:190px}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlayGo</title>
  <meta name="theme-color" content="#6c4cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-bola-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon-app.png">
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"></noscript>
  <link rel="stylesheet" href="app.css">
  <link rel="preload" as="style" href="/static/mural.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="/static/mural.css"></noscript>
  <link rel="preload" as="style" href="/static/chaves.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="/static/chaves.css"></noscript>
  <link rel="preload" as="style" href="/static/telao.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="/static/telao.css"></noscript>
  <link rel="preload" as="style" href="/static/tutorial.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="/static/tutorial.css"></noscript>
</head>
<body>
  <div id="abertura" aria-hidden="true"><img src="icon-bola-512.png" alt="" width="190" height="190"></div>
  <header id="topo" hidden>
    <a class="marca" href="#/"><img src="/static/marca/icone.svg" alt="" width="28" height="28" class="marca-ico">Play<span>Go</span></a>
    <div class="topo-acoes">
      <a class="icone sino" id="mod" href="#/moderacao" aria-label="Moderação" title="Moderação" hidden><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#shield-check"/></svg><b id="modn" hidden></b></a>
      <a class="icone" href="#/feed" aria-label="Feed" title="Feed"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#pen-line"/></svg></a>
      <button id="loc" class="icone" aria-label="Minha localização" title="Usar minha localização"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#locate-fixed"/></svg></button>
      <a class="icone sino" href="#/notificacoes" aria-label="Notificações"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#bell"/></svg><b id="sino" hidden></b></a>
      <button id="eu-btn" class="eu-btn" type="button" aria-label="Menu da conta" aria-haspopup="true" aria-expanded="false"><span class="avatar" id="eu-avatar"></span></button>
    </div>
  </header>
  <div id="menu-pop" role="menu" hidden></div>
  <main id="view" aria-live="polite"></main>
  <nav id="abas" hidden aria-label="Principal">
    <a href="#/" data-aba="inicio"><i><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#home"/></svg></i>Início</a>
    <a href="#/explorar" data-aba="explorar"><i><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#compass"/></svg></i>Explorar</a>
    <a href="#/criar" data-aba="criar" class="central"><i><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#plus"/></svg></i>Criar</a>
    <a href="#/grupos" data-aba="grupos"><i><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#users"/></svg></i>Grupos</a>
    <a href="#/campeonatos" data-aba="campeonatos"><i><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#trophy"/></svg></i>Campeonatos</a>
  </nav>
  <div id="toast" role="status"></div>
  <div id="folha" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="/static/mapa.js" defer></script>
  <script src="/static/mural.js" defer></script>
  <script src="/static/chaves.js" defer></script>
  <script src="/static/icones.js" defer></script>
  <script src="/static/camera.js" defer></script>
  <script src="/static/telao.js" defer></script>
  <script src="/static/elenco.js" defer></script>
  <script src="/static/instagram.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
