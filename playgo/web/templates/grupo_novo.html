{% extends "base.html" %}
{% import "_cards.html" as c %}
{% block titulo %}Criar grupo — PlayGo{% endblock %}
{% block conteudo %}
<div class="section-title"><h2>Criar grupo</h2></div>
<form class="panel" method="post" action="/grupos">
  <div class="form-grid">
    <div class="field"><label for="nome">Nome do grupo</label><input name="nome" id="nome" required maxlength="150" placeholder="Ex.: Corre CG"></div>
    <div class="field"><label for="modalidade_id">Modalidade</label>
      <select name="modalidade_id" id="modalidade_id">{% for m in modalidades %}<option value="{{ m.id }}">{{ m.icone }} {{ m.nome }}</option>{% endfor %}</select></div>
    <div class="field"><label for="cidade">Cidade</label><input name="cidade" id="cidade" value="{{ usuario.cidade or '' }}"></div>
    <div class="field"><label for="local_habitual">Local habitual</label><input name="local_habitual" id="local_habitual" placeholder="Ex.: Parque das Nações"></div>
    <div class="field"><label for="entrada">Entrada no grupo</label>
      <select name="entrada" id="entrada"><option value="aprovacao">Com aprovação (você aceita cada pedido)</option><option value="livre">Livre (entra quem quiser)</option></select></div>
    <div class="field full"><label for="descricao">Descrição</label><textarea name="descricao" id="descricao" placeholder="Para quem é o grupo, ritmo, dias…"></textarea></div>
    {{ c.seletor_local(centro, centro.latitude if centro.informada else '', centro.longitude if centro.informada else '') }}
  </div>
  <br><button class="btn purple">Criar grupo</button>
</form>
{% endblock %}
