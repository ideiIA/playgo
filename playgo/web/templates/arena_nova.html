{% extends "base.html" %}
{% import "_cards.html" as c %}
{% block titulo %}Cadastrar arena — PlayGo{% endblock %}
{% block conteudo %}
<div class="section-title"><h2>Cadastrar arena</h2></div>
<form class="panel" method="post" action="/gestao/arenas">
  <div class="form-grid">
    <div class="field"><label for="nome">Nome da arena</label><input name="nome" id="nome" required maxlength="200" placeholder="Ex.: Arena Sports"></div>
    <div class="field"><label for="tipo_estabelecimento">Tipo de estabelecimento</label><select name="tipo_estabelecimento" id="tipo_estabelecimento"><option value="arena">Arena</option><option value="academia">Academia</option><option value="clube">Clube</option><option value="escola">Escola</option></select></div>
    <div class="field"><label for="cidade">Cidade</label><input name="cidade" id="cidade" value="{{ usuario.cidade or '' }}"></div>
    <div class="field full"><label for="endereco">Endereço</label><input name="endereco" id="endereco" placeholder="Rua, número, bairro"></div>
    <div class="field"><label for="abre">Abre às</label><input type="time" name="abre" id="abre" value="06:00" required></div>
    <div class="field"><label for="fecha">Fecha às</label><input type="time" name="fecha" id="fecha" value="23:00" required></div>
    {{ c.seletor_local(centro, centro.latitude if centro.informada else '', centro.longitude if centro.informada else '') }}
    <div class="field full"><label for="estrutura">Estrutura</label><input name="estrutura" id="estrutura" placeholder="Vestiário, bar, estacionamento…"></div>
    <div class="field full"><label for="descricao">Descrição</label><textarea name="descricao" id="descricao"></textarea></div>
    <div class="field full"><label for="regras">Regras da casa</label><textarea name="regras" id="regras"></textarea></div>
  </div>
  <br><button class="btn purple">Cadastrar arena</button>
</form>
{% endblock %}
